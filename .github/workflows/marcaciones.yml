name: Marcaciones Automáticas

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  enviar-marcaciones:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
      
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install requests pytz
      
      # ⬇️ VERIFICAR QUE TODOS LOS SECRETS EXISTEN
      - name: 🔍 Verificar secrets configurados
        run: |
          echo "Verificando variables de entorno..."
          
          if [ -n "${{ secrets.URL_API }}" ]; then
            echo "✅ URL_API configurado correctamente"
          else
            echo "❌ URL_API NO configurado"
            exit 1
          fi
          
          if [ -n "${{ secrets.RUT }}" ]; then
            echo "✅ RUT configurado correctamente"
          else
            echo "❌ RUT NO configurado"
            exit 1
          fi
          
          if [ -n "${{ secrets.PASSWORD }}" ]; then
            echo "✅ PASSWORD configurado correctamente"
          else
            echo "❌ PASSWORD NO configurado"
            exit 1
          fi
      
      - name: 🚀 Ejecutar marcaciones
        run: python marcaciones.py
        env:
          URL_API: ${{ secrets.URL_API }}
          RUT: ${{ secrets.RUT }}
          PASSWORD: ${{ secrets.PASSWORD }}
      
      - name: 📝 Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-marcaciones-${{ github.run_id }}
          path: marcaciones.log
          retention-days: 7

name: Marcaciones Automáticas

on:
  schedule:
    # ⬇️ Horarios de INVIERNO (UTC-4)
    - cron: '0 13 * * 1-5'     # 9:00 Chile
    - cron: '30 22 * * 1-4'    # 18:30 Chile
    - cron: '0 22 * * 5'       # 18:00 Chile
    
    # ⬇️ Horarios de VERANO (UTC-3)
    - cron: '0 12 * * 1-5'     # 9:00 Chile
    - cron: '30 21 * * 1-4'    # 18:30 Chile
    - cron: '0 21 * * 5'       # 18:00 Chile
    
    # ⬇️ Respaldo cada 5 minutos
    - cron: '*/5 * * * *'
  
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  enviar-marcaciones:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
      
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: 📦 Instalar dependencias
        run: pip install requests pytz
      
      - name: 🚀 Ejecutar marcaciones
        run: python marcaciones.py
        env:
          URL_API: ${{ secrets.URL_API }}
          RUT: ${{ secrets.RUT }}
          PASSWORD: ${{ secrets.PASSWORD }}
      
      - name: 📝 Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: marcaciones.log
          retention-days: 7

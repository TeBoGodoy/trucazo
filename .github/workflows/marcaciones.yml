# .github/workflows/marcaciones.yml
name: Marcaciones Automáticas

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  enviar-marcaciones:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
      
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install requests pytz  # ⬅️ AGREGAR pytz
      
      - name: 🚀 Ejecutar marcaciones
        run: python marcaciones.py
        env:
          RUT: ${{ secrets.RUT }}
          PASSWORD: ${{ secrets.PASSWORD }}
      
      - name: 📝 Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-marcaciones-${{ github.run_id }}
          path: marcaciones.log
          retention-days: 7

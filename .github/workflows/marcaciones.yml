name: Marcaciones Automáticas

on:
  # Ejecutar cada 5 minutos
  schedule:
    - cron: '*/5 * * * *'
  
  # Permitir ejecución manual desde la interfaz de GitHub
  workflow_dispatch:

  # Ejecutar al hacer push a main (para pruebas)
  push:
    branches: [ main ]

jobs:
  enviar-marcaciones:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Clonar el repositorio
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v3
      
      # 2. Configurar Python
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      # 3. Instalar dependencias
      - name: 📦 Instalar dependencias
        run: |
          pip install requests
      
      # 4. Ejecutar el script
      - name: 🚀 Ejecutar marcaciones
        run: python marcaciones.py
        env:
          RUT: ${{ secrets.RUT }}
          PASSWORD: ${{ secrets.PASSWORD }}
      
      # 5. Guardar logs (opcional)
      - name: 📝 Guardar logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: logs
          path: marcaciones.log
          retention-days: 7

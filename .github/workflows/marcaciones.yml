name: Marcaciones Automáticas

on:
  # Ejecutar cada 5 minutos
  schedule:
    - cron: '*/5 * * * *'
  
  # Permitir ejecución manual desde la interfaz de GitHub
  workflow_dispatch:

  # Ejecutar al hacer push a main (para pruebas)
  push:
    branches: [ main ]

jobs:
  enviar-marcaciones:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Clonar el repositorio - Versión más reciente
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4.2.2
      
      # 2. Configurar Python - Versión más reciente
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'  # Actualizado a Python 3.12
      
      # 3. Instalar dependencias
      - name: 📦 Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install requests
      
      # 4. Ejecutar el script
      - name: 🚀 Ejecutar marcaciones
        run: python marcaciones.py
        env:
          RUT: ${{ secrets.RUT }}
          PASSWORD: ${{ secrets.PASSWORD }}
      
      # 5. Guardar logs - Versión más reciente
      - name: 📝 Guardar logs
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: logs-marcaciones-${{ github.run_id }}
          path: marcaciones.log
          retention-days: 7
          overwrite: true
